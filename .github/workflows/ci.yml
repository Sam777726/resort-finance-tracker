name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campdilly
          POSTGRES_PASSWORD: campdilly
          POSTGRES_DB: campdilly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campdilly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://campdilly:campdilly@localhost:5432/campdilly?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Test shared package (pure pricing/meal-count logic)
        run: npm run test -w packages/shared

      - name: Generate Prisma client
        run: npm run prisma:generate -w apps/api

      - name: Sync schema to the CI database
        run: npx prisma db push --skip-generate
        working-directory: apps/api

      - name: Build API
        run: npm run build -w apps/api

      - name: Lint API
        run: npm run lint -w apps/api

      - name: Build web app
        run: npm run build -w apps/web

      - name: Lint web app
        run: npm run lint -w apps/web
