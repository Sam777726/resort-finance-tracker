name: Publish images

# Builds the api and web Docker images and pushes them to GitHub Container
# Registry on every push to main. The production server only ever `docker
# compose pull` these — it never runs `npm install`/`tsc`/`vite build`
# itself, which matters on a 1GB droplet with no swap.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker/GHCR image names must be lowercase; github.repository_owner
      # isn't (it's "Sam777726") and GitHub Actions expressions have no
      # built-in lowercase function, so compute it in a shell step instead.
      - name: Compute lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/resort-finance-tracker-${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/resort-finance-tracker-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
